name: Recipe CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: recipe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck, Vitest, build and built-site smoke
        run: pnpm verify
      - name: Install Chromium for browser acceptance tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance — desktop and mobile viewport
        run: pnpm test:browser
      - name: Preserve failing browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-playwright-results
          path: test-results/
          if-no-files-found: ignore

      - name: Preserve P17 synthetic visual review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-p17-synthetic-visual-review
          path: test-results/p17-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve P18 synthetic access-denial review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-p18-denied-sharing-visual-review
          path: test-results/p18-*.png
          if-no-files-found: warn
          retention-days: 7
